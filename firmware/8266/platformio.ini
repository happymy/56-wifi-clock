; 56-wifi-clock ESP-01S (ESP8266) firmware
; 权威: firmware/8266/编程计划.md、plan/串口通信协议.md
[env:esp01_1m]
platform = espressif8266@4.2.1
framework = arduino
board = esp01_1m
board_build.ldscript = eagle.flash.1m.ld
monitor_speed = 9600
build_flags =
    ; 1M(no SPIFFS/OTA) 分区: irom 程序区 1023984B(≈999KB), EEPROM 保留 4KB(1 sector)
    -Wall
    -DCORE_DEBUG_LEVEL=0